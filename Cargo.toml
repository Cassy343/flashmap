[package]
name = "flashmap"
version = "0.2.0"
authors = ["Cassy343"]
edition = "2024"

description = "A lock-free eventually consistent concurrent hash map."
repository = "https://github.com/Cassy343/flashmap"
license = "MIT"
readme = "README.md"

keywords = ["map", "concurrent", "hashmap"]
categories = ["concurrency", "data-structures"]

[dependencies]
num_cpus = "1"
slab = "0.4.12"

[dependencies.hashbrown]
version = "0.16.1"
default-features = false
features = ["inline-more", "raw-entry"]

[dependencies.loom]
version = "0.7.2"
features = ["checkpoint"]
optional = true

[features]
default = []
nightly = []
loom = ["dep:loom"]

[profile.loomtest]
inherits = "release"
debug = 2
debug-assertions = true
lto = "fat"
codegen-units = 1

[profile.loomtest-fast]
inherits = "loomtest"
debug = 0
debug-assertions = false
strip = "symbols"
panic = "abort"
